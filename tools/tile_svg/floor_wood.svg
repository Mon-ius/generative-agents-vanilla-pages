    <line x1="0" y1="48" x2="64" y2="48"/><line x1="0" y1="0" x2="64" y2="0"/>
  </g>
  <g stroke="#e0c08a" stroke-width="0.8" opacity="0.55">
    <line x1="0" y1="17" x2="64" y2="17"/><line x1="0" y1="33" x2="64" y2="33"/>
    <line x1="0" y1="49" x2="64" y2="49"/><line x1="0" y1="1" x2="64" y2="1"/>
  </g>
  <g stroke="#7c5430" stroke-width="1.4" opacity="0.7">
    <line x1="22" y1="0" x2="22" y2="16"/><line x1="48" y1="16" x2="48" y2="32"/>
    <line x1="14" y1="32" x2="14" y2="48"/><line x1="40" y1="48" x2="40" y2="64"/>
