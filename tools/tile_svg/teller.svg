    </linearGradient>
    <linearGradient id="teller_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc6b2"/><stop offset="1" stop-color="#b6ac95"/>
    </linearGradient>
    <linearGradient id="teller_glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f2f8" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#cfe6ef" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a9cfdd" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="teller_tray" x1="0" y1="0" x2="0" y2="1">
