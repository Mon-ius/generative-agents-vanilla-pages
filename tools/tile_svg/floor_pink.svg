<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="floor_pink_face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7dde4"/><stop offset="0.5" stop-color="#f0d0d9"/><stop offset="1" stop-color="#e8c3cf"/>
    </linearGradient>
  </defs>
  <!-- salmon-pink bathroom floor with a seamless 45 degree diamond lattice (period 16) -->
  <rect width="64" height="64" fill="url(#floor_pink_face)"/>
  <g stroke="#e0acba" stroke-width="1.4">
    <line x1="0" y1="0" x2="64" y2="64"/><line x1="0" y1="16" x2="48" y2="64"/><line x1="0" y1="32" x2="32" y2="64"/><line x1="0" y1="48" x2="16" y2="64"/>
    <line x1="16" y1="0" x2="64" y2="48"/><line x1="32" y1="0" x2="64" y2="32"/><line x1="48" y1="0" x2="64" y2="16"/>
    <line x1="0" y1="16" x2="16" y2="0"/><line x1="0" y1="32" x2="32" y2="0"/><line x1="0" y1="48" x2="48" y2="0"/><line x1="0" y1="64" x2="64" y2="0"/>
    <line x1="16" y1="64" x2="64" y2="16"/><line x1="32" y1="64" x2="64" y2="32"/><line x1="48" y1="64" x2="64" y2="48"/>
  </g>
  <!-- pale highlight just inside each lattice line for a tiled sheen -->
  <g stroke="#fceff3" stroke-width="0.6" opacity="0.6">
    <line x1="0" y1="2" x2="62" y2="64"/><line x1="2" y1="0" x2="64" y2="62"/>
    <line x1="2" y1="64" x2="64" y2="2"/><line x1="0" y1="62" x2="62" y2="0"/>
  </g>
  <!-- tiny dot at each lattice node -->
  <g fill="#d99fae" opacity="0.7">
    <circle cx="0" cy="0" r="1.1"/><circle cx="16" cy="16" r="1.1"/><circle cx="32" cy="32" r="1.1"/><circle cx="48" cy="48" r="1.1"/><circle cx="64" cy="64" r="1.1"/>
    <circle cx="32" cy="0" r="1.1"/><circle cx="48" cy="16" r="1.1"/><circle cx="16" cy="48" r="1.1"/><circle cx="0" cy="32" r="1.1"/>
    <circle cx="0" cy="64" r="1.1"/><circle cx="64" cy="0" r="1.1"/><circle cx="32" cy="64" r="1.1"/><circle cx="64" cy="32" r="1.1"/>
  </g>
</svg>
