  <rect x="11" y="11" width="34" height="34" rx="5" fill="#5b3d22" filter="url(#chair_grain)" opacity="0.32"/>
  <circle cx="15" cy="15" r="2.4" fill="#7c5430"/><circle cx="41" cy="15" r="2.4" fill="#7c5430"/>
  <circle cx="15" cy="41" r="2.4" fill="#7c5430"/><circle cx="41" cy="41" r="2.4" fill="#7c5430"/>
  <rect x="13" y="13" width="30" height="8" rx="3" fill="#fbf7ef" opacity="0.14"/>
